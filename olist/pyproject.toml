[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "module_olist"
version = "0.0.1"
description = "Projeto de machine learning para an\u00e1lise e previs\u00e3o de atrasos nas entregas da Olist."
authors = [
  { name = "Rafael Athaliba" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "fg-data-profiling[notebook]>=4.20.0",
    "ipykernel>=7.4.0",
    "ipython",
    "joblib>=1.6.0",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pandera[pandas]>=0.35.0",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn>=1.2",
    "tqdm",
    "typer",
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["module_olist"]
include = ["pyproject.toml", "module_olist/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["module_olist"]
force-sort-within-sections = true

